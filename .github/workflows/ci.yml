# Checks every push to main and every pull request, also those of Dependabot: the frontend on each Node.js version PRISMA supports
# ("engines" in frontend/package.json), and the Python tools. The browser smoke tests (npm run test-e2e) need Chrome and
# run on your own computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,vue,css}" "e2e/**/*.ts" "*.{ts,js}"
      - run: npx vitest run
      - run: npm run build

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tools
